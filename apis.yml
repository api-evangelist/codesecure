name: CodeSecure
description: >-
  CodeSecure is an application security testing company whose CodeSonar static
  application security testing (SAST) engine performs deep whole-program
  analysis of C, C++, Java, and other languages to find bugs, security
  vulnerabilities, and coding-standard violations, and whose CodeSentry binary
  software composition analysis (SCA) tool generates SBOMs and detects
  vulnerabilities in third-party and binary components. CodeSecure merged with
  AdaCore in 2025, combining SAST and SCA tooling with high-integrity software
  development for aerospace, automotive, defense, medical, and industrial
  customers. The tools support SARIF, CWE, MISRA, CERT, and OWASP as well as
  safety standards such as ISO 26262, IEC 61508, EN 50128, and DO-178C, and
  integrate with CI/CD, IDE, and issue-tracking pipelines rather than exposing a
  public developer REST API.
